[package]
name = "meta-signal-flow"
version = "0.96.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/meta-signal-flow"
description = "Privileged Flow Nexus Signal contract."
publish = false
build = "build.rs"

[features]
default = []
datom = ["dep:datom-codec", "dep:protos", "flow-ethos/datom", "signal-flow/datom", "signal/datom"]

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "c93b598", optional = true }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "4f5cbb9322ecae7a8821439179e778d495d7804a", default-features = false }
signal-flow = { git = "https://github.com/LiGoldragon/signal-flow", rev = "6932471e69f06cf2f8f27b3d09e80ac67feb396f" }
flow-ethos = { git = "https://github.com/LiGoldragon/flow", rev = "062ef9e1", default-features = false }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }

[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "f23eacf" }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"

# The generated contract is committed byte for byte from its ethos source.
[lints.clippy]
large_enum_variant = "allow"
